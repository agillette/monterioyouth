<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monte Rio Youth</title>
  <meta name="description" content="Monte Rio Youth. Stay tuned for updates and events.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- BODY-START -->
<main class="page">
  <h1 class="wordmark" aria-label="Monte Rio Youth">
    <span>Monte<br class="phone-break"> Rio</span>
    <span>Youth</span>
  </h1>

  <div class="foot">
    <p class="tagline">Stay tuned for updates and&nbsp;events.</p>

    <form class="signup" id="signup" novalidate>
      <div class="signup-row">
        <input class="signup-input" id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-label="Email address" required>
        <button class="signup-button" id="signup-submit" type="submit">Keep me posted</button>
      </div>
      <!-- Honeypot: invisible to people, bots tend to fill it. Submissions with a value are dropped. -->
      <div class="hp" aria-hidden="true">
        <label for="website">Leave this field empty</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <p class="signup-status" id="signup-status" role="status" aria-live="polite"></p>
    </form>

    <p class="place">Made in Vacation Wonderland</p>
  </div>
</main>

<script>
  (function () {
    // Supabase: inserts go straight to the REST API with the publishable key.
    // The key is safe to expose; row-level security on the table restricts
    // anonymous clients to INSERT only.
    var SUPABASE_URL = 'https://iulgbnyhjhodxfygjhma.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_sXssaQwC9x1AYbbecrpFhA_1V4cDyc-';
    var TABLE = 'signups';

    var form = document.getElementById('signup');
    var email = document.getElementById('email');
    var honeypot = document.getElementById('website');
    var status = document.getElementById('signup-status');
    var button = document.getElementById('signup-submit');

    function say(text, kind) {
      status.textContent = text;
      status.dataset.kind = kind || '';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      say('');
      if (!email.checkValidity()) {
        say('Enter a valid email address.', 'error');
        email.focus();
        return;
      }
      if (honeypot.value) {
        // Likely a bot. Pretend it worked and send nothing.
        say('You\u2019re on the list. Thanks!', 'ok');
        form.reset();
        return;
      }
      button.disabled = true;
      fetch(SUPABASE_URL + '/rest/v1/' + TABLE, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ email: email.value.trim().toLowerCase() })
      }).then(function (r) {
        if (r.ok || r.status === 409) {
          // 409 = already signed up (unique email); treat as success.
          say('You\u2019re on the list. Thanks!', 'ok');
          form.reset();
        } else {
          throw new Error('status ' + r.status);
        }
      }).catch(function () {
        say('Something went wrong. Try again in a moment.', 'error');
      }).finally(function () {
        button.disabled = false;
      });
    });
  })();
</script>
<!-- BODY-END -->
</body>
</html>
